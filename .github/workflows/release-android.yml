name: Publish Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed release APK
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_PATH: app/release-keystore.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate signing secrets and restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD KEYSTORE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: ANDROID_RELEASE_${name#RELEASE_}"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          test -s "$RELEASE_KEYSTORE_PATH"
          keytool -list -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null

      - name: Download Vazirmatn fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf"
          for weight in Thin ExtraLight Light Regular Medium SemiBold Bold ExtraBold Black; do
            curl -fsSL "$base/Vazirmatn-$weight.ttf" -o "app/src/main/res/font/vazirmatn_$(echo "$weight" | tr '[:upper:]' '[:lower:]').ttf"
          done

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "Nono-$VERSION.apk"
          sha256sum "Nono-$VERSION.apk" > "Nono-$VERSION.apk.sha256"

      - name: Show release signing fingerprint
        shell: bash
        run: |
          set -euo pipefail
          SHA1="$(keytool -list -v -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | awk '/SHA1:/{print $2; exit}')"
          SHA256="$(keytool -list -v -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')"
          {
            echo "## Firebase release certificate"
            echo "- Package: ir.herotux.pregnancytracker"
            echo "- Release SHA-1: $SHA1"
            echo "- Release SHA-256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nono ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Nono-${{ github.ref_name }}.apk
            Nono-${{ github.ref_name }}.apk.sha256
