name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify Gradle
        run: gradle --version
      - name: Download Vazirmatn fonts
        run: |
          set -e
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf"
          for weight in Thin ExtraLight Light Regular Medium SemiBold Bold ExtraBold Black; do
            curl -fsSL "$base/Vazirmatn-$weight.ttf" -o "app/src/main/res/font/vazirmatn_$(echo "$weight" | tr '[:upper:]' '[:lower:]').ttf"
          done
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Print Android debug SHA-1 for Firebase
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          test -f "$KEYSTORE"
          SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | awk -F': ' '/SHA1:/{print $2; exit}')"
          test -n "$SHA1"
          echo "Android debug SHA-1: $SHA1"
          {
            echo "## Firebase Android fingerprint"
            echo ""
            echo "- Package: `ir.herotux.pregnancytracker`"
            echo "- Build: Debug"
            echo "- SHA-1: `$SHA1`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: PregnancyTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
