name: Build APK
on:
  push:
    branches: [main, feature/professional-care-access]
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # Keep the CI debug signing certificate stable between builds.
      # The cache is created on the first successful build and restored on later runs.
      - name: Restore stable Android debug keystore
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Verify Gradle
        run: gradle --version
      - name: Download Vazirmatn fonts
        run: |
          set -e
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf"
          for weight in Thin ExtraLight Light Regular Medium SemiBold Bold ExtraBold Black; do
            curl -fsSL "$base/Vazirmatn-$weight.ttf" -o "app/src/main/res/font/vazirmatn_$(echo "$weight" | tr '[:upper:]' '[:lower:]').ttf"
          done
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Print Android debug SHA-1 for Firebase
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:signingReport --console=plain --no-daemon | tee signing-report.txt
          SHA1="$(awk '/SHA1:/{print $2; exit}' signing-report.txt)"
          test -n "$SHA1"
          echo "Android debug SHA-1: $SHA1"
          {
            echo "## Firebase Android fingerprint"
            echo ""
            echo "- Package: `ir.herotux.pregnancytracker`"
            echo "- Build: Debug"
            echo "- SHA-1: `$SHA1`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: PregnancyTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
